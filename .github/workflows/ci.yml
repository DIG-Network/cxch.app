name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI only reads the tree; it publishes nothing and writes no checks of its own.
permissions:
  contents: read

jobs:
  rust-core:
    name: cmojo-core (test + wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmojo-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cmojo-core
      - name: Install clang (blst needs it for the wasm build)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest retries a failing test up to twice before reporting it red, so a
      # genuinely flaky simulator round-trip does not fail an otherwise-good PR.
      # A test that fails all three attempts is a real failure and still blocks.
      - name: Run simulator round-trip tests (nextest, flaky-retry)
        run: cargo nextest run --release --retries 2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || cargo install wasm-pack
      - name: Build WASM package
        run: wasm-pack build --release --target web --out-dir ../app/wasm-pkg

  frontend:
    name: app (next build)
    runs-on: ubuntu-latest
    needs: rust-core
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || cargo install wasm-pack
      - name: Build WASM package
        run: npm run build:wasm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests + coverage (>=80%)
        run: npm run coverage
      - name: Build
        run: npm run build
